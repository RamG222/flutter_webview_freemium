name: asdf
description: "A new Flutter project."
publish_to: "none"

version: 2.0.0+3

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0
  easy_splash_screen: ^1.0.4 # no new update available
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  restart_app: ^1.2.1 # no new update

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  assets:
    - assets/
  uses-material-design: true
